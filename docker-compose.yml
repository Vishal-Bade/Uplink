version: '3.8'

services:
  # -------------------------------------------------------------
  # 1. Primary Relational Database (Local fallback / standalone)
  # -------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: uplink-postgres
    restart: always
    environment:
      POSTGRES_DB: uplink_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/main/resources/schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - uplink-network

  # -------------------------------------------------------------
  # 2. Cache & Distributed Session Store (Redis)
  # -------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: uplink-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - uplink-network

  # -------------------------------------------------------------
  # 3. AI / Processing Services (FastAPI Microservice)
  # -------------------------------------------------------------
  ai-service:
    build:
      context: ./ai_service
      dockerfile: Dockerfile
    container_name: uplink-ai-service
    restart: always
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - uplink-network

  # -------------------------------------------------------------
  # 4. Spring Boot Modular Monolith Backend
  # -------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: uplink-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # Defaults to container postgres, or overrides with cloud Supabase pooler via .env
      SUPABASE_DB_URL: ${SUPABASE_DB_URL:-jdbc:postgresql://postgres:5432/uplink_db}
      SUPABASE_DB_USER: ${SUPABASE_DB_USER:-postgres}
      SUPABASE_DB_PASSWORD: ${SUPABASE_DB_PASSWORD:-postgrespassword}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      AI_SERVICE_URL: http://ai-service:8000
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      STORAGE_UPLOAD_DIR: ./uploads
    ports:
      - "8080:8080"
    volumes:
      - uplink_uploads:/app/uploads
    networks:
      - uplink-network

networks:
  uplink-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  uplink_uploads:
