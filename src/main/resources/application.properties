# ===================================================================
# Uplink - AI-Powered Academia-Industry Collaboration & Placement Platform
# Application Configuration
# ===================================================================

spring.application.name=Uplink-Backend
server.port=8080

# -------------------------------------------------------------------
# Database Configuration (Supabase PostgreSQL Connection Pooler)
# -------------------------------------------------------------------
spring.datasource.url=${SUPABASE_DB_URL:jdbc:postgresql://aws-0-ap-south-1.pooler.supabase.com:6543/postgres?sslmode=require}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${SUPABASE_DB_USER:postgres.phdfzmmehvglnnxchjrr}
spring.datasource.password=${SUPABASE_DB_PASSWORD:Bhilwade@123}

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# H2 Console (Disabled when using external Supabase database)
spring.h2.console.enabled=false

# -------------------------------------------------------------------
# Security & JWT Configuration
# -------------------------------------------------------------------
uplink.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
uplink.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
uplink.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# -------------------------------------------------------------------
# File Storage Configuration (Supabase Storage / Local Storage)
# -------------------------------------------------------------------
uplink.storage.upload-dir=${STORAGE_UPLOAD_DIR:./uploads}
uplink.storage.supabase.url=${SUPABASE_URL:}
uplink.storage.supabase.key=${SUPABASE_KEY:}
uplink.storage.supabase.bucket=${SUPABASE_BUCKET:uplink-files}

# -------------------------------------------------------------------
# AI / FastAPI Processing Service Integration
# -------------------------------------------------------------------
uplink.ai-service.url=${AI_SERVICE_URL:http://localhost:8000}
uplink.ai-service.timeout-ms=${AI_SERVICE_TIMEOUT_MS:5000}

# -------------------------------------------------------------------
# Redis & Caching Configuration
# -------------------------------------------------------------------
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.repositories.enabled=false

# -------------------------------------------------------------------
# SpringDoc OpenAPI / Swagger Settings
# -------------------------------------------------------------------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# -------------------------------------------------------------------
# File Upload Limits
# -------------------------------------------------------------------
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# -------------------------------------------------------------------
# Email Service Configuration (Mock / SMTP)
# -------------------------------------------------------------------
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
